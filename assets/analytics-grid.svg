<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="ag-stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#070a16"/>
    </linearGradient>
    <linearGradient id="ag-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15192e"/>
      <stop offset="1" stop-color="#0e1224"/>
    </linearGradient>
    <linearGradient id="ag-spark1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ag-spark2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#ag-stage)"/>

  <!-- Top label strip -->
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="10" letter-spacing="4">
    <g transform="translate(60,52)" fill="#4ade80">
      <circle cx="6" cy="-3" r="3.5">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="20" y="0">OPEN TO WORK // FREELANCE + FULL-TIME</text>
    </g>
    <g transform="translate(1140,52)" fill="#94a3b8" text-anchor="end">
      <text x="-20" y="0">HYDERABAD // IST</text>
      <line x1="-14" y1="-4" x2="0" y2="-4" stroke="#94a3b8" stroke-width="0.5"/>
    </g>
  </g>

  <!-- Headline -->
  <text x="60" y="100" font-family="Inter, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#e2e8f0">Tarun Gudapati</text>
  <text x="60" y="124" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#64748b" letter-spacing="2">SOFTWARE ENGINEER // .NET + ANGULAR // SHIPS DESIGN TOO</text>

  <!-- Card 1: EXPERIENCE -->
  <g transform="translate(60,148)">
    <rect width="262" height="128" rx="12" fill="url(#ag-card)" stroke="#1f2540" stroke-width="0.7"/>
    <text x="18" y="32" font-family="JetBrains Mono, Consolas, monospace" font-size="9" fill="#64748b" letter-spacing="3">EXPERIENCE // PRODUCTION</text>
    <text x="18" y="74" font-family="Inter, Segoe UI, sans-serif" font-size="36" font-weight="700" fill="#f1f5f9">2 yrs</text>
    <text x="18" y="92" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#4ade80">shipping real systems, not demos</text>
    <polyline points="18,116 42,112 66,108 90,104 114,98 138,94 162,86 186,82 210,76 238,70" fill="none" stroke="#4ade80" stroke-width="1.4"/>
    <polyline points="18,116 42,112 66,108 90,104 114,98 138,94 162,86 186,82 210,76 238,70 238,120 18,120" fill="url(#ag-spark1)"/>
  </g>

  <!-- Card 2: DOMAINS -->
  <g transform="translate(338,148)">
    <rect width="262" height="128" rx="12" fill="url(#ag-card)" stroke="#1f2540" stroke-width="0.7"/>
    <text x="18" y="32" font-family="JetBrains Mono, Consolas, monospace" font-size="9" fill="#64748b" letter-spacing="3">DOMAINS // SHIPPED</text>
    <text x="18" y="74" font-family="Inter, Segoe UI, sans-serif" font-size="36" font-weight="700" fill="#f1f5f9">3<tspan font-size="18" fill="#a78bfa" dx="6">domains</tspan></text>
    <text x="18" y="92" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#a78bfa">fintech / HR / inventory</text>
    <g fill="#a78bfa">
      <rect x="18" y="108" width="6" height="14" opacity="0.35"/>
      <rect x="28" y="106" width="6" height="16" opacity="0.4"/>
      <rect x="38" y="100" width="6" height="22" opacity="0.45"/>
      <rect x="48" y="104" width="6" height="18" opacity="0.5"/>
      <rect x="58" y="98" width="6" height="24" opacity="0.55"/>
      <rect x="68" y="102" width="6" height="20" opacity="0.6"/>
      <rect x="78" y="96" width="6" height="26" opacity="0.65"/>
      <rect x="88" y="92" width="6" height="30" opacity="0.7"/>
      <rect x="98" y="100" width="6" height="22" opacity="0.75"/>
      <rect x="108" y="94" width="6" height="28" opacity="0.8"/>
      <rect x="118" y="98" width="6" height="24" opacity="0.85"/>
      <rect x="128" y="90" width="6" height="32" opacity="0.9"/>
      <rect x="138" y="86" width="6" height="36" opacity="0.95"/>
      <rect x="148" y="82" width="6" height="40"/>
      <rect x="158" y="78" width="6" height="44">
        <animate attributeName="height" values="44;38;44" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="78;84;78" dur="2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Card 3: DISCIPLINES -->
  <g transform="translate(616,148)">
    <rect width="262" height="128" rx="12" fill="url(#ag-card)" stroke="#1f2540" stroke-width="0.7"/>
    <text x="18" y="32" font-family="JetBrains Mono, Consolas, monospace" font-size="9" fill="#64748b" letter-spacing="3">DISCIPLINES // BILLABLE</text>
    <text x="18" y="70" font-family="Inter, Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#f1f5f9">dev + design</text>
    <text x="18" y="88" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#fcd34d">engineer and designer, one hire</text>
    <g font-family="JetBrains Mono, Consolas, monospace" font-size="8" fill="#64748b">
      <text x="18" y="104">code</text>
      <rect x="62" y="99" width="176" height="4" rx="2" fill="#1a2540"/>
      <rect x="62" y="99" width="152" height="4" rx="2" fill="#fcd34d"/>
      <text x="18" y="118">design</text>
      <rect x="62" y="113" width="176" height="4" rx="2" fill="#1a2540"/>
      <rect x="62" y="113" width="120" height="4" rx="2" fill="#fcd34d" opacity="0.75"/>
    </g>
  </g>

  <!-- Card 4: AI / LLM -->
  <g transform="translate(894,148)">
    <rect width="246" height="128" rx="12" fill="url(#ag-card)" stroke="#1f2540" stroke-width="0.7"/>
    <text x="18" y="32" font-family="JetBrains Mono, Consolas, monospace" font-size="9" fill="#64748b" letter-spacing="3">AI / LLM // SHIPPED</text>
    <text x="18" y="72" font-family="Inter, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#f1f5f9">in prod</text>
    <text x="18" y="90" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#67e8f9">Claude API, real users</text>
    <g>
      <line x1="32" y1="112" x2="212" y2="112" stroke="#1a2540" stroke-width="1.5"/>
      <circle cx="32" cy="112" r="5" fill="#67e8f9">
        <animate attributeName="opacity" values="1;0.25;0.25;0.25;0.25;1" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="77" cy="112" r="5" fill="#67e8f9">
        <animate attributeName="opacity" values="0.25;1;0.25;0.25;0.25;0.25" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="122" cy="112" r="5" fill="#67e8f9">
        <animate attributeName="opacity" values="0.25;0.25;1;0.25;0.25;0.25" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="167" cy="112" r="5" fill="#67e8f9">
        <animate attributeName="opacity" values="0.25;0.25;0.25;1;0.25;0.25" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="212" cy="112" r="5" fill="#67e8f9">
        <animate attributeName="opacity" values="0.25;0.25;0.25;0.25;1;0.25" dur="2.5s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Trajectory chart (full width) -->
  <g transform="translate(60,296)">
    <rect width="1080" height="84" rx="12" fill="url(#ag-card)" stroke="#1f2540" stroke-width="0.7"/>
    <text x="18" y="22" font-family="JetBrains Mono, Consolas, monospace" font-size="9" fill="#64748b" letter-spacing="3">TRAJECTORY // BACKEND BASICS TO AI INTEGRATION</text>

    <polyline points="18,68 90,64 170,60 250,56 330,50 410,46 490,42 570,38 650,32 730,28 810,24 890,22 970,20 1050,20 1062,20" fill="url(#ag-spark2)"/>
    <polyline points="18,68 90,64 170,60 250,56 330,50 410,46 490,42 570,38 650,32 730,28 810,24 890,22 970,20 1050,20 1062,20" fill="none" stroke="#a78bfa" stroke-width="1.6"/>

    <circle cx="1062" cy="20" r="4" fill="#fef3c7">
      <animate attributeName="r" values="4;7;4" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1062" cy="20" r="10" fill="none" stroke="#fef3c7" stroke-width="0.6">
      <animate attributeName="r" values="10;18;10" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <g font-family="JetBrains Mono, Consolas, monospace" font-size="8" fill="#475569">
      <text x="18" y="76">apis</text>
      <text x="250" y="76">full-stack</text>
      <text x="570" y="76">production systems</text>
      <text x="890" y="76">llm integration</text>
    </g>
  </g>

  <!-- Footer signature -->
  <g transform="translate(60,400)" font-family="JetBrains Mono, Consolas, monospace" font-size="10" letter-spacing="3" fill="#475569">
    <text>BUILD IT / SHIP IT / MAKE IT LOOK GOOD</text>
  </g>
</svg>
