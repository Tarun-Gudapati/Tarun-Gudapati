<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Tarun Gudapati - Analytics Grid">
  <defs>
    <linearGradient id="ag-stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#070a16"/>
    </linearGradient>
    <linearGradient id="ag-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15192e"/>
      <stop offset="1" stop-color="#0e1224"/>
    </linearGradient>
    <linearGradient id="ag-spark1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ag-spark2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ag-spark3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fcd34d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ag-spark4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#ag-stage)"/>

  <!-- Top label strip -->
  <g font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="4">
    <g transform="translate(60,52)" fill="#4ade80">
      <circle cx="6" cy="-3" r="3.5">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="20" y="0">LIVE &#x00B7; SHIPPING CODE</text>
    </g>
    <g transform="translate(1140,52)" fill="#94a3b8" text-anchor="end">
      <text x="-20" y="0">DASHBOARD &#x00B7; 2026</text>
      <line x1="-14" y1="-4" x2="0" y2="-4" stroke="#94a3b8" stroke-width="0.5"/>
    </g>
  </g>

  <!-- Headline -->
  <text x="60" y="100" font-family="'Inter', 'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="700" fill="#e2e8f0">Today, in numbers.</text>
  <text x="60" y="124" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b" letter-spacing="2">TARUN GUDAPATI  &#x00B7;  COMMITS &#x00B7; STREAK &#x00B7; SYSTEMS &#x00B7; CADENCE</text>

  <!-- Four KPI cards -->
  <!-- Card 1: COMMITS -->
  <g transform="translate(60,148)">
    <rect width="262" height="128" rx="12" fill="url(#ag-card)" stroke="#1f2540" stroke-width="0.7"/>
    <text x="18" y="32" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b" letter-spacing="3">COMMITS &#x00B7; 30D</text>
    <text x="18" y="74" font-family="'Inter', system-ui, sans-serif" font-size="36" font-weight="700" fill="#f1f5f9">420+</text>
    <text x="18" y="92" font-family="'JetBrains Mono', monospace" font-size="11" fill="#4ade80">&#x25B2; 24%  vs prev 30d</text>
    <!-- sparkline -->
    <polyline points="18,116 38,110 58,108 78,102 98,106 118,94 138,98 158,86 178,90 198,78 218,82 238,72" fill="none" stroke="#4ade80" stroke-width="1.4"/>
    <polyline points="18,116 38,110 58,108 78,102 98,106 118,94 138,98 158,86 178,90 198,78 218,82 238,72 238,120 18,120" fill="url(#ag-spark1)"/>
  </g>

  <!-- Card 2: STREAK -->
  <g transform="translate(338,148)">
    <rect width="262" height="128" rx="12" fill="url(#ag-card)" stroke="#1f2540" stroke-width="0.7"/>
    <text x="18" y="32" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b" letter-spacing="3">STREAK &#x00B7; CURRENT</text>
    <text x="18" y="74" font-family="'Inter', system-ui, sans-serif" font-size="36" font-weight="700" fill="#f1f5f9">60<tspan font-size="20" fill="#a78bfa">d</tspan></text>
    <text x="18" y="92" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a78bfa">building every single day</text>
    <!-- streak bars -->
    <g fill="#a78bfa">
      <rect x="18" y="108" width="6" height="14" opacity="0.4"/>
      <rect x="28" y="106" width="6" height="16" opacity="0.45"/>
      <rect x="38" y="100" width="6" height="22" opacity="0.5"/>
      <rect x="48" y="104" width="6" height="18" opacity="0.55"/>
      <rect x="58" y="98" width="6" height="24" opacity="0.6"/>
      <rect x="68" y="102" width="6" height="20" opacity="0.65"/>
      <rect x="78" y="96" width="6" height="26" opacity="0.7"/>
      <rect x="88" y="92" width="6" height="30" opacity="0.75"/>
      <rect x="98" y="100" width="6" height="22" opacity="0.8"/>
      <rect x="108" y="94" width="6" height="28" opacity="0.85"/>
      <rect x="118" y="98" width="6" height="24" opacity="0.9"/>
      <rect x="128" y="90" width="6" height="32" opacity="0.95"/>
      <rect x="138" y="86" width="6" height="36"/>
      <rect x="148" y="82" width="6" height="40"/>
      <rect x="158" y="78" width="6" height="44">
        <animate attributeName="height" values="44;38;44" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="78;84;78" dur="2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Card 3: SYSTEMS SHIPPED -->
  <g transform="translate(616,148)">
    <rect width="262" height="128" rx="12" fill="url(#ag-card)" stroke="#1f2540" stroke-width="0.7"/>
    <text x="18" y="32" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b" letter-spacing="3">SYSTEMS &#x00B7; PRODUCTION</text>
    <text x="18" y="74" font-family="'Inter', system-ui, sans-serif" font-size="36" font-weight="700" fill="#f1f5f9">5+</text>
    <text x="18" y="92" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fcd34d">fintech &#x00B7; HRMS &#x00B7; inventory</text>
    <!-- sparkline -->
    <polyline points="18,116 58,112 98,106 138,100 178,96 218,90 238,86" fill="none" stroke="#fcd34d" stroke-width="1.4"/>
    <polyline points="18,116 58,112 98,106 138,100 178,96 218,90 238,86 238,120 18,120" fill="url(#ag-spark3)"/>
  </g>

  <!-- Card 4: CADENCE -->
  <g transform="translate(894,148)">
    <rect width="246" height="128" rx="12" fill="url(#ag-card)" stroke="#1f2540" stroke-width="0.7"/>
    <text x="18" y="32" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b" letter-spacing="3">CADENCE &#x00B7; WEEKLY</text>
    <text x="18" y="74" font-family="'Inter', system-ui, sans-serif" font-size="32" font-weight="700" fill="#f1f5f9">mon&#x2192;sat</text>
    <text x="18" y="92" font-family="'JetBrains Mono', monospace" font-size="11" fill="#67e8f9">6AM grind &#x00B7; no days off</text>
    <!-- weekday dots -->
    <g font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">
      <circle cx="32" cy="112" r="5" fill="#67e8f9"/><text x="32" y="124" text-anchor="middle">M</text>
      <circle cx="62" cy="112" r="5" fill="#67e8f9"/><text x="62" y="124" text-anchor="middle">T</text>
      <circle cx="92" cy="112" r="5" fill="#67e8f9"/><text x="92" y="124" text-anchor="middle">W</text>
      <circle cx="122" cy="112" r="5" fill="#67e8f9"/><text x="122" y="124" text-anchor="middle">T</text>
      <circle cx="152" cy="112" r="5" fill="#67e8f9"/><text x="152" y="124" text-anchor="middle">F</text>
      <circle cx="182" cy="112" r="5" fill="#67e8f9" opacity="0.7"/><text x="182" y="124" text-anchor="middle">S</text>
      <circle cx="212" cy="112" r="5" fill="#1a2540"/><text x="212" y="124" text-anchor="middle">S</text>
    </g>
  </g>

  <!-- Trend chart (full width) -->
  <g transform="translate(60,296)">
    <rect width="1080" height="84" rx="12" fill="url(#ag-card)" stroke="#1f2540" stroke-width="0.7"/>
    <text x="18" y="22" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b" letter-spacing="3">ENGINEERING VELOCITY &#x00B7; 90 DAYS</text>

    <!-- area -->
    <polyline points="18,68 50,62 90,58 130,54 170,50 210,46 250,48 290,42 330,38 370,34 410,36 450,30 490,32 530,26 570,28 610,22 650,24 690,18 730,20 770,24 810,18 850,22 890,26 930,20 970,24 1010,18 1050,22 1062,20" fill="url(#ag-spark2)"/>
    <polyline points="18,68 50,62 90,58 130,54 170,50 210,46 250,48 290,42 330,38 370,34 410,36 450,30 490,32 530,26 570,28 610,22 650,24 690,18 730,20 770,24 810,18 850,22 890,26 930,20 970,24 1010,18 1050,22 1062,20" fill="none" stroke="#a78bfa" stroke-width="1.6"/>

    <!-- live dot at end -->
    <circle cx="1062" cy="20" r="4" fill="#fef3c7">
      <animate attributeName="r" values="4;7;4" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1062" cy="20" r="10" fill="none" stroke="#fef3c7" stroke-width="0.6">
      <animate attributeName="r" values="10;18;10" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <text x="1062" y="74" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a78bfa">shipping &#x00B7; Safe Financials</text>
  </g>

  <!-- Footer signature -->
  <g transform="translate(60,400)" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="3" fill="#475569">
    <text>TARUN GUDAPATI  &#x00B7;  .NET + ANGULAR  &#x00B7;  SAFE FINANCIALS  &#x00B7;  HYDERABAD</text>
  </g>
</svg>
